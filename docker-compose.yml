services:
  meshtastic-bot:
    image: ${DOCKER_IMAGE:-ghcr.io/babdor/daddy_bv:latest}
    pull_policy: always
    # To build locally instead of pulling from GHCR, uncomment the build block below:
    # build:
    #   context: .
    container_name: meshtastic_python_app
    restart: unless-stopped

    environment:
      # Points to your host LLM instance
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyUSB0}
      - LOG_FILE=/app/logs/bot.log
      - PYTHONUNBUFFERED=1

    # Enables host resolution inside Docker (e.g. host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # USB Serial Passthrough (CP2102 UART Bridge to /dev/ttyUSB0 inside container)
    # Adjust path if your serial device identifier differs
    devices:
      - ${SERIAL_DEVICE:-/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0}:/dev/ttyUSB0

    group_add:
      - dialout

    volumes:
      - /run/udev:/run/udev:ro
      - ./logs:/app/logs  # Persists bot.log on host machine

  bot-dashboard:
    build:
      context: ./dashboard
    image: ${DASHBOARD_IMAGE:-ghcr.io/babdor/daddy_bv-dashboard:latest}
    pull_policy: always
    container_name: meshtastic_bot_dashboard
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - LOG_FILE=/app/logs/bot.log
    volumes:
      - ./logs:/app/logs:ro  # Read-only access to bot.log
    depends_on:
      - meshtastic-bot

  # Automatic Image Updater: Checks GHCR every 60s and updates container automatically
  watchtower:
    image: containrrr/watchtower
    container_name: meshtastic_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup